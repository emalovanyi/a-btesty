<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymBeam · A/B testy (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --or:#ff4100;--or-h:#cc3400;--or-s:#c23500;--or-50:#fff3ee;
  --g50:#fafafa;--g100:#f5f5f5;--g200:#e9e9e9;--g300:#d6d6d6;--g400:#a3a3a3;--g500:#6b6b6b;--g600:#525252;
  --ok:#2cb35b;--ok-l:#7cd59b;--ok-50:#eaf7ef;--gift:#ff4100;--gift-l:#ff8a65;
  --chrome:150px;--avail:760px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:#dfe0e3;color:#111;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* ============ TOOL CHROME ============ */
.tb{position:sticky;top:0;z-index:100;background:#111;color:#fff}
.tb__row{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.tb__brand{font-weight:800;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.tb__brand span{color:var(--or)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{display:flex;align-items:center;gap:8px;background:#222;color:#cfcfcf;border:1px solid #333;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{background:#2b2b2b;color:#fff}
.tab.on{background:#fff;color:#111;border-color:#fff}
.tab b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#333;color:#fff;font-size:11px}
.tab.on b{background:var(--or)}
.prio{font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:4px}
.prio--HOT{background:#ffe1e1;color:#b40000}.prio--WIN{background:#ffe9d6;color:#a34a00}.prio--MONITOR{background:#fff6c8;color:#7a6200}
.seg{display:flex;background:#222;border:1px solid #333;border-radius:8px;padding:3px}
.seg button{background:none;border:0;color:#bbb;font-size:12px;font-weight:700;padding:6px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:#111}
.tb__reset{background:none;border:1px solid #444;color:#ddd;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.tb__reset:hover{border-color:#888;color:#fff}
.info{color:#111;background:#fff;border-bottom:1px solid #cfd0d4;padding:12px 20px;display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(300px,2fr) auto;gap:20px;align-items:start}
.info h2{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center}
.info__where{font-size:12px;color:var(--g500)}
.info__metric{font-size:12px;color:var(--g600);margin-top:6px}
.vars{display:flex;flex-direction:column;gap:6px}
.var{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--g50);border:1.5px solid var(--g200);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;line-height:1.35;color:#222}
.var:hover{border-color:var(--g400)}
.var.on{border-color:var(--or);background:var(--or-50)}
.var b{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#111;color:#fff;font-size:12px}
.var.on b{background:var(--or)}
.var small{display:block;color:var(--g500);font-size:11px;margin-top:2px}
.flow{display:flex;flex-direction:column;gap:6px;min-width:190px}
.flow__t{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.05em}
.flow__chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{border:1px solid var(--g300);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:#333}
.chip.on{background:#111;color:#fff;border-color:#111}
.flow__arrow{color:var(--g400);font-size:11px}
.note{font-size:12px;background:#fff8e1;border:1px solid #f3e1a0;color:#6d5600;border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.35}
.measure{font-size:12px;background:#eef4ff;border:1px solid #cfdcf7;color:#1f3f7a;border-radius:6px;padding:6px 8px;margin-top:6px;line-height:1.35}
@media (max-width:1100px){.info{grid-template-columns:1fr}.flow{min-width:0}}
/* ============ STAGE / DEVICES ============ */
.stage{display:flex;justify-content:center;align-items:flex-start;padding:16px}
.dev{position:relative;background:#fff;overflow:hidden;transform:translateZ(0)}
.dev--m{width:390px;height:min(844px,var(--avail));border:10px solid #111;border-radius:46px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dev--m::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#111;border-radius:16px;z-index:90;pointer-events:none}
.dev--m .scr{top:34px}
.dev--m .ov{top:34px}
.dev--m .urlbar{height:34px;background:#fff;border-bottom:0;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:700;color:#000}
.dev--m .vchip{display:none}
.dev--d{width:100%;max-width:1440px;height:var(--avail);border-radius:10px;border:1px solid #bcbdc2;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.urlbar{position:absolute;top:0;left:0;right:0;height:38px;background:#ececee;border-bottom:1px solid #d3d3d6;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:80}
.urlbar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.urlbar i:nth-child(2){background:#febc2e}.urlbar i:nth-child(3){background:#28c840}
.urlbar span{margin-left:12px;flex:1;max-width:560px;background:#fff;border-radius:6px;height:24px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#555}
.dev--d .scr{top:38px}
.scr{position:absolute;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;background:#fff;color:#000;font-size:14px;line-height:1.45;scroll-behavior:auto}
.dev--m .scr{scrollbar-width:none}.dev--m .scr::-webkit-scrollbar{display:none}
/* ============ SITE: BASE ============ */
.scr a{color:inherit;text-decoration:none;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.is-d .wrap{padding:0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:4px;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.02em;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:scale(.99)}
.btn--or{background:var(--or);color:#fff}.btn--or:hover{background:var(--or-h)}
.btn--ol{background:#fff;border-color:#000;color:#000}.btn--ol:hover{background:var(--g100)}
.btn--blk{background:#000;color:#fff}.btn--blk:hover{background:#333}
.btn--full{width:100%}.btn--lg{height:56px;font-size:15px}.btn--xl{height:64px;font-size:16px}
.btn--sm{height:36px;padding:0 14px;font-size:12px}
.lnk,.scr .lnk,.toast .lnk{color:var(--or-s);font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
.muted{color:var(--g500)}
.h1{font-size:22px;font-weight:800;margin:0;line-height:1.2}
.is-d .h1{font-size:30px}
.card{border:1px solid var(--g200);border-radius:8px;background:#fff}
.sec-t{font-size:16px;font-weight:800;margin:0 0 12px}
.sec-t.up{text-transform:uppercase;font-size:14px;letter-spacing:.03em}
input.in,select.in{width:100%;height:46px;border:1px solid var(--g200);border-radius:4px;padding:0 12px;font:inherit;font-size:14px;background:#fff;color:#000}
input.in:focus,select.in:focus{outline:2px solid #000;outline-offset:-1px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600}
.fld label em{color:var(--or);font-style:normal}
.ico{width:20px;height:20px;flex:none}
/* ============ HEADER ============ */
.hd{background:#fff;border-bottom:1px solid var(--g200);z-index:40;position:relative}
.is-m .hd{position:sticky;top:0}
.hd__row{display:flex;align-items:center;gap:10px;height:56px}
.is-d .hd__row{height:80px;gap:32px}
.hd__logo{display:flex;align-items:center}
.hd__logo svg{height:20px;width:auto}
.is-d .hd__logo svg{height:30px}
.hd__burger{background:none;border:0;padding:6px;margin-left:-6px;cursor:pointer;display:flex}
.hd__search{flex:1;max-width:464px;position:relative}
.hd__search input{padding-left:40px;height:44px}
.hd__search .ico{position:absolute;left:12px;top:12px;color:var(--g500)}
.hd__ctrls{margin-left:auto;display:flex;gap:2px;align-items:center}
.ic{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;cursor:pointer;background:none;border:0;color:#000}
.ic:hover{background:var(--g100)}
.badge{position:absolute;top:1px;right:-1px;background:var(--or);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;line-height:1}
.badge.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.35)}}
.hd__cart{position:relative;display:flex;align-items:center}
.hd__sum{font-weight:700;font-size:14px;margin-left:2px;cursor:pointer}
.hd__msearch{padding:0 16px 10px;position:relative}
.hd__msearch input{height:40px;padding-left:38px;background:var(--g100);border-color:var(--g100)}
.hd__msearch .ico{position:absolute;left:28px;top:10px;color:var(--g500)}
.hd__nav{border-top:1px solid var(--g200)}
.hd__nav .wrap{display:flex;gap:28px;height:48px;align-items:center;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.hd__nav .sale{color:var(--or)}
.pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--or);animation:pulse 1.6s infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.4);opacity:0}}
.hd--min .hd__row{justify-content:center}
.is-d .hd--min .hd__row{justify-content:space-between}
.hstep{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--g500)}
.hstep span{display:flex;align-items:center;gap:8px}
.hstep i{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.hstep .on{color:#000}.hstep .on i{background:#000;border-color:#000;color:#fff}
.hstep .done{color:#000}.hstep .done i{background:var(--ok);border-color:var(--ok);color:#fff}
.hstep hr{width:40px;border:0;border-top:1.5px solid var(--g300);margin:0}
.hd__secure{font-size:12px;color:var(--g500);display:flex;gap:6px;align-items:center}
/* mobile steps */
.steps{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--g200);background:#fff;font-size:12px}
.step{display:flex;align-items:center;gap:6px;color:var(--g500);font-weight:500}
.step i{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px}
.step.on{color:#000;font-weight:700}.step.on i{background:#000;color:#fff;border-color:#000}
.step.done{color:#000}.step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps hr{flex:1;border:0;border-top:1px solid var(--g300);margin:0 8px}
/* ============ MINICART ============ */
.mc{position:absolute;top:calc(100% + 10px);right:-8px;width:400px;background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.18);border:1px solid var(--g200);z-index:60;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility .15s}
.mc.open{opacity:1;visibility:visible;transform:none}
.mc::before{content:"";position:absolute;top:-7px;right:22px;width:12px;height:12px;background:#fff;border-left:1px solid var(--g200);border-top:1px solid var(--g200);transform:rotate(45deg)}
.mc__list{max-height:280px;overflow:auto;padding:8px 16px}
.mc__it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--g100)}
.mc__it:last-child{border-bottom:0}
.mc__it img{width:56px;height:56px;object-fit:contain;flex:none}
.mc__n{font-size:13px;font-weight:600;line-height:1.3}
.mc__v{font-size:12px;color:var(--g500)}
.mc__p{margin-left:auto;font-weight:700;font-size:14px;white-space:nowrap}
.mc__foot{padding:14px 16px 16px;border-top:1px solid var(--g200);display:flex;flex-direction:column;gap:10px}
.mc__empty{padding:28px 16px;text-align:center;color:var(--g500)}
.mc__gift{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--or-50);border-radius:6px;padding:8px 10px;color:#7a2300}
.mstep{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--g500)}
.mstep span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.mstep i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;border:1.5px solid currentColor}
.mstep .done{color:#000}.mstep .done i{background:var(--ok);border-color:var(--ok);color:#fff}
.mstep .nx{color:#000}.mstep .nx i{background:#000;color:#fff;border-color:#000}
.mstep hr{flex:1;border:0;border-top:1.5px dashed var(--g300);margin:0}
.mc__cap{font-size:12px;color:var(--g600);line-height:1.4;margin-top:-2px}
.mc__sec{text-align:center;font-size:13px}
/* ============ GOALS BAR ============ */
.goals{background:var(--g100);border-radius:8px;padding:12px}
.goal+.goal{margin-top:8px;padding-top:8px;border-top:1px solid var(--g200)}
.goal__r{display:flex;align-items:center;gap:8px}
.goal__l{flex:1;font-size:14px;font-weight:500}
.goal__rem{font-size:14px;font-weight:600;color:var(--g500);white-space:nowrap}
.goal__rem.ok{color:var(--ok)}
.goal__bar{margin-top:6px;height:6px;border-radius:999px;background:var(--g200);overflow:hidden}
.goal__bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
.goal--ship .ico{color:var(--ok)}.goal--ship .goal__bar i{background:linear-gradient(to right,var(--ok),var(--ok-l))}
.goal--gift .ico{color:var(--gift)}.goal--gift .goal__bar i{background:linear-gradient(to right,var(--gift),var(--gift-l))}
.goals__top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--g200);font-size:13px}
.goals--b{background:#fff;border:1px solid var(--g200);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.goals__hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--g500);margin-bottom:8px}
.fs-hint{display:block;font-size:11px;color:var(--ok);font-weight:600;margin-top:2px}
/* ============ CART ============ */
.cart{padding-bottom:40px}
.is-m .cart{padding-top:14px}
.is-d .cart{padding-top:28px}
.cart__grid{display:block}
.is-d .cart__grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;align-items:start}
.cart__ttl{display:flex;align-items:baseline;gap:10px;margin:14px 0 12px}
.is-d .cart__ttl{margin:0 0 20px}
.cart__cnt{font-size:14px;color:var(--g500);font-weight:500}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
.ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--g200)}
.ci:first-of-type{border-top:1px solid var(--g200)}
.ci__img{width:84px;height:84px;object-fit:contain;flex:none;border-radius:6px;background:#fff}
.ci__b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ci__n{font-weight:600;font-size:14px;line-height:1.3}
.ci__v{font-size:12px;color:var(--g500)}
.ci__dl{font-size:12px;color:var(--g600);display:flex;gap:5px;align-items:center}
.ci__dl .ico{width:14px;height:14px;color:var(--ok)}
.ci__row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.ci__p{font-weight:800;font-size:16px;white-space:nowrap}
.ci__old{font-size:12px;color:var(--g500);text-decoration:line-through;font-weight:500;margin-right:6px}
.ci__unit{font-size:11px;color:var(--g500);text-align:right}
.ci__rm{font-size:12px;color:var(--g500);text-decoration:underline;background:none;border:0;cursor:pointer;padding:0}
.ci__gift{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--or-s);background:var(--or-50);border-radius:4px;padding:2px 6px;width:max-content}
.is-d .ci{display:grid;grid-template-columns:96px minmax(0,1fr) 120px 110px 28px;align-items:center;gap:16px}
.is-d .ci__img{width:96px;height:96px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--g300);border-radius:4px;height:36px}
.qty button{width:34px;height:34px;background:none;border:0;cursor:pointer;display:grid;place-items:center}
.qty button:hover{background:var(--g100)}
.qty span{min-width:28px;text-align:center;font-weight:700;font-size:14px}
.xbtn{width:28px;height:28px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--g500)}
.xbtn:hover{background:var(--g100);color:#000}
/* gifts */
.gifts{border:1.5px solid var(--g200);border-radius:8px;padding:14px;margin-bottom:14px;transition:border-color .3s,box-shadow .3s}
.gifts.hl{border-color:var(--or);box-shadow:0 0 0 4px rgba(255,65,0,.12)}
.gifts__h{display:flex;align-items:center;gap:10px;cursor:pointer}
.gifts__h .ico{color:var(--or)}
.gifts__t{font-weight:700;flex:1}
.gifts__s{font-size:12px;color:var(--g500)}
.gifts__opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gopt{border:1.5px solid var(--g200);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;cursor:pointer;position:relative}
.gopt img{width:72px;height:72px;object-fit:contain}
.gopt.sel{border-color:var(--ok);background:var(--ok-50)}
.gopt__n{font-size:12px;font-weight:600;line-height:1.3}
.gopt__f{font-size:12px;font-weight:800;color:var(--ok)}
.gopt__chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.gifts__ft{display:flex;justify-content:flex-end;margin-top:10px}
/* loyalty + coupon */
.loy{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--g200);border-radius:8px}
.loy__ic{width:40px;height:40px;border-radius:50%;background:#fff7d6;display:grid;place-items:center;flex:none;font-size:20px}
.loy__t{font-weight:700;font-size:14px}.loy__s{font-size:12px;color:var(--g500)}
.coupon{border:1px solid var(--g200);border-radius:8px}
.coupon__h{display:flex;align-items:center;justify-content:space-between;padding:14px;cursor:pointer;font-weight:600;font-size:14px}
.coupon__b{display:flex;gap:8px;padding:0 14px 14px}
.coupon__ok{font-size:12px;color:var(--ok);padding:0 14px 12px;font-weight:600}
.m-blocks{display:flex;flex-direction:column;gap:12px;margin-top:16px}
/* reco carousel */
.reco{margin-top:28px}
.reco__h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.reco__t{font-size:18px;font-weight:700;margin:0}
.reco__cnt{font-size:12px;color:var(--g500)}
.reco__nav{display:flex;gap:6px}
.reco__nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--g300);background:#fff;cursor:pointer;display:grid;place-items:center}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 14px;scrollbar-width:thin}
.is-m .rail{margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding-left:16px;scrollbar-width:none}
.is-m .rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:156px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;position:relative}
.is-d .tile{width:196px}
.tile__img{aspect-ratio:1;border-radius:6px;overflow:hidden;background:#fff;position:relative;border:1px solid var(--g100)}
.tile__img img{width:100%;height:100%;object-fit:contain}
.tile__lbl{position:absolute;top:6px;left:6px;background:var(--or);color:#fff;font-size:11px;font-weight:800;padding:2px 6px;border-radius:3px}
.tile__add{position:absolute;right:6px;bottom:6px;width:38px;height:38px;border-radius:50%;background:#000;color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tile__add:hover{background:var(--or)}
.tile__add.done{background:var(--ok)}
.tile__n{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.tile__r{font-size:11px;color:var(--g500);display:flex;align-items:center;gap:3px}
.stars{color:#ffb400;letter-spacing:-1px;font-size:12px}
.tile__p{font-weight:800;font-size:15px}
.tile__u{font-size:11px;color:var(--g500)}
/* summary */
.sum{display:flex;flex-direction:column;gap:12px}
.is-d .sum{border:1px solid var(--g200);border-radius:8px;padding:20px}
.is-m .sum.inline{margin-top:24px;padding:16px;border:1px solid var(--g200);border-radius:8px;background:#fff}
.sum__t{font-size:18px;font-weight:800;margin:0}
.sum__lines{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sum__l{display:flex;justify-content:space-between;gap:8px}
.sum__l .muted{font-size:13px}
.sum__disc{color:var(--ok)}
.sum__tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--g200);padding-top:12px}
.sum__tot b{font-size:20px;font-weight:800}
.sum__vat{font-size:12px;color:var(--g500);text-align:right;margin-top:-8px}
.sum__err{font-size:13px;color:#c40000;background:#fff1f1;border-radius:6px;padding:8px 10px}
.sum__obl{font-size:12px;color:var(--g500);text-align:center;margin-top:-4px}
.sum__back{display:flex;justify-content:center}
.cta-hl{animation:ctahl 1.2s ease-out 1}
@keyframes ctahl{0%{box-shadow:0 0 0 0 rgba(255,65,0,.5)}100%{box-shadow:0 0 0 14px rgba(255,65,0,0)}}
/* trust */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:12px 10px;list-style:none;background:var(--g50);border:1px solid var(--g200);border-radius:8px}
.trust li{text-wrap:balance;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:12px;line-height:1.25;font-weight:600}
.trust li span{font-weight:400;color:var(--g500);font-size:11px}
.trust .tico{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--g200);display:grid;place-items:center;color:#000}
.trust .tico .ico{width:18px;height:18px}
.trust-row{display:flex;justify-content:center;gap:6px;font-size:11px;color:var(--g500);align-items:center}
/* sticky bars (0-height trick) */
.stk-b{position:sticky;bottom:0;height:0;z-index:45}
.stk-t{position:sticky;top:0;height:0;z-index:45}
.sbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--g200);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 16px calc(10px + 14px);display:flex;align-items:center;gap:12px;transition:transform .25s ease,opacity .25s,visibility .25s}
.sbar.hide{transform:translateY(12px);opacity:0;visibility:hidden}
.sbar__t{font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:6px}
.sbar__t b{font-size:19px;font-weight:800}
.sbar__s{font-size:11px;color:var(--g500)}
.sbar .btn{margin-left:auto;flex:1;max-width:190px}
.sbar__goal{position:absolute;left:0;right:0;bottom:100%;}
.pad-sbar{padding-bottom:96px !important}
/* ============ CHECKOUT ============ */
.ck{padding-bottom:40px}
.is-m .ck{padding-top:14px}.is-d .ck{padding-top:28px}
.ck__grid{display:block}
.is-d .ck__grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start}
.ck__main{display:flex;flex-direction:column;gap:20px}
.ck__sec{display:flex;flex-direction:column;gap:12px}
.ck__sec+.ck__sec{border-top:1px solid var(--g200);padding-top:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--g500);display:flex;gap:6px;align-items:flex-start}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:#000;flex:none}
.locbtn{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;background:none;border:0;padding:0;cursor:pointer;width:max-content}
.warn{display:flex;gap:10px;align-items:flex-start;background:#fff4e5;border:1px solid #ffd59e;border-radius:8px;padding:12px;font-size:13px;color:#6b3d00}
.warn .ico{color:#e07b00}
.infob{display:flex;gap:10px;align-items:flex-start;background:#eef6ff;border:1px solid #cfe2fb;border-radius:8px;padding:12px 12px;font-size:13px;color:#18406e;position:relative}
.infob .ico{color:#2a6fc7}
.infob__x{position:absolute;top:6px;right:6px;background:none;border:0;cursor:pointer;color:#6788ad;padding:4px}
.smg{border:1px solid var(--g200);border-radius:8px;overflow:hidden}
.smg+.smg{margin-top:10px}
.smg__h{padding:12px 14px;font-weight:700;font-size:13px;background:var(--g50);border-bottom:1px solid var(--g200);display:flex;justify-content:space-between}
.sm{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-top:1px solid var(--g100)}
.sm:first-of-type{border-top:0}
.sm:hover{background:var(--g50)}
.sm.sel{background:#fff;box-shadow:inset 3px 0 0 #000}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--g300);flex:none;display:grid;place-items:center}
.sel .radio{border-color:#000}.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#000}
.sm__logo{width:42px;height:28px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em}
.sm__b{flex:1;min-width:0}
.sm__n{font-weight:600;font-size:14px}
.sm__d{font-size:12px;color:var(--g500)}
.sm__d b{color:var(--ok);font-weight:600}
.sm__p{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.sm__p .old{display:block;font-size:11px;color:var(--g500);text-decoration:line-through;font-weight:500}
.sm__p .free{color:var(--ok)}
.sm__x{padding:0 14px 12px 46px}
.pt{display:flex;gap:10px;align-items:center;font-size:13px;background:var(--g50);border-radius:6px;padding:10px 12px}
.ois{border:1px solid var(--g200);border-radius:8px}
.ois__h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;cursor:pointer}
.ois__h span{display:flex;gap:8px;align-items:center}
.ois__b{padding:0 16px 10px;border-top:1px solid var(--g100)}
.ois__it{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px}
.ois__it img{width:44px;height:44px;object-fit:contain}
.ois__it b{margin-left:auto;white-space:nowrap}
.pm-extra{padding:4px 14px 14px 46px;display:flex;flex-direction:column;gap:10px}
.agree{font-size:13px}
.agree a{text-decoration:underline}
/* ============ PDP ============ */
.pdp{padding-bottom:40px}
.bc{display:flex;gap:6px;font-size:12px;color:var(--g500);padding:12px 0;flex-wrap:wrap}
.bc b{color:#000;font-weight:500}
.pdp__top{display:block}
.is-d .pdp__top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.gal{position:relative}
.gal__main{aspect-ratio:1;background:#fff;border-radius:8px;display:grid;place-items:center;position:relative;overflow:hidden}
.gal__main img{width:88%;height:88%;object-fit:contain}
.gal__lbl{position:absolute;top:12px;left:12px;background:var(--or);color:#fff;font-weight:800;font-size:13px;padding:4px 8px;border-radius:4px}
.gal__th{display:flex;gap:8px;margin-top:10px}
.gal__th button{width:64px;height:64px;border:1.5px solid var(--g200);border-radius:6px;background:#fff;padding:4px;cursor:pointer}
.gal__th button.on{border-color:#000}
.gal__th img{width:100%;height:100%;object-fit:contain}
.bb{display:flex;flex-direction:column;gap:14px}
.is-m .bb{margin-top:14px}
.bb__h{display:flex;gap:12px;align-items:flex-start}
.bb__h h1{font-size:22px;font-weight:800;margin:0;line-height:1.2;flex:1}
.is-d .bb__h h1{font-size:28px}
.bb__rat{display:flex;gap:6px;align-items:center;font-size:13px}
.bb__rat a{text-decoration:underline;color:var(--g600)}
.bb__desc{font-size:14px;color:var(--g600);line-height:1.5}
.bb__desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bb__sel{display:grid;grid-template-columns:1fr 130px;gap:10px}
.bb__price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bb__price b{font-size:30px;font-weight:800}
.bb__price s{color:var(--g500);font-size:16px}
.bb__price .tt{font-size:11px;color:var(--g500);border-bottom:1px dotted var(--g400);cursor:help}
.bb__unit{font-size:12px;color:var(--g500);margin-top:-10px}
.bb__buy{display:flex;gap:10px}
.bb__buy .qty{height:64px}
.bb__buy .qty button{height:62px;width:40px}
.bb__buy .btn{flex:1}
.dgrid{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--g200);border-radius:8px}
.is-d .dgrid{grid-template-columns:1fr 1fr}
.dgrid div{display:flex;gap:10px;align-items:center;padding:12px 14px;font-size:13px;border-top:1px solid var(--g200)}
.dgrid div:first-child{border-top:0}
.is-d .dgrid div:nth-child(2){border-top:0}
.is-d .dgrid div:nth-child(odd){border-right:1px solid var(--g200)}
.dgrid .ico{color:#000}
.dgrid u{text-decoration:underline;cursor:pointer}
.rail-sec{margin-top:36px}
.rail-sec--b{margin-top:28px;padding:20px 0 6px;border-top:1px solid var(--g200);border-bottom:1px solid var(--g200)}
.ptabs{margin-top:40px}
.ptabs__nav{display:flex;gap:28px;border-bottom:1px solid var(--g200)}
.ptabs__nav button{background:none;border:0;padding:14px 0;font-weight:700;font-size:15px;color:var(--g500);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs__nav button.on{color:#000;border-color:var(--or)}
.ptabs__p{padding:22px 0;font-size:14px;line-height:1.65;color:#222;max-width:860px}
.ptabs__p h3{font-size:16px;margin:0 0 8px}
.ptabs__p ul{margin:6px 0 0;padding-left:18px}
.acc{border-top:1px solid var(--g200)}
.acc:last-child{border-bottom:1px solid var(--g200)}
.acc__h{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:700;font-size:15px;cursor:pointer}
.acc__b{padding:0 0 16px;font-size:14px;line-height:1.6;color:#333}
.rv{display:flex;gap:16px;align-items:center}
.rv__big{font-size:44px;font-weight:800;line-height:1}
.rv__bars{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px}
.rv__bars div{display:flex;align-items:center;gap:8px}
.rv__bars i{flex:1;height:6px;background:var(--g200);border-radius:3px;overflow:hidden;display:block}
.rv__bars i b{display:block;height:100%;background:#ffb400}
.dstk{position:absolute;top:0;left:0;right:0;background:#fff;border-bottom:1px solid var(--g200);box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-12px);opacity:0;visibility:hidden;transition:transform .2s,opacity .2s,visibility .2s}
.dstk.show{transform:none;opacity:1;visibility:visible}
.dstk .wrap{display:flex;align-items:center;gap:16px;height:72px}
.dstk img{width:48px;height:48px;object-fit:contain}
.dstk__n{font-weight:700;font-size:14px;flex:1}
.mstk{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--g200);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 12px 22px;display:flex;gap:8px;transform:translateY(12px);opacity:0;visibility:hidden;transition:transform .2s,opacity .2s,visibility .2s}
.mstk.show{transform:none;opacity:1;visibility:visible}
.mstk .btn{height:50px}
.mstk .btn--or{flex:1}
/* success */
.succ{max-width:720px;margin:0 auto;padding:36px 16px 60px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.succ__ic{width:72px;height:72px;border-radius:50%;background:var(--ok-50);color:var(--ok);display:grid;place-items:center}
.succ__ic .ico{width:36px;height:36px}
.succ__no{font-size:18px}
.succ__reg{border:1px solid var(--g200);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.succ__img{width:200px;opacity:.95}
/* footer mini */
.ft{background:#000;color:#bbb;font-size:12px;padding:22px 0;margin-top:20px}
.ft .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* overlays in device */
.ov{position:absolute;inset:0;z-index:70;pointer-events:none}
.dev--d .ov{top:38px}
.ov.on{pointer-events:auto}
.ov__bg{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;max-height:82%;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.dev--d .sheet{left:50%;top:50%;bottom:auto;right:auto;width:520px;transform:translate(-50%,-50%);border-radius:12px;max-height:80%;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
.sheet__grab{width:40px;height:4px;border-radius:2px;background:var(--g300);margin:8px auto 0}
.dev--d .sheet__grab{display:none}
.sheet__h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--g200)}
.sheet__h b{font-size:16px}
.sheet__b{overflow:auto;padding:12px 16px}
.sheet__f{padding:12px 16px 22px;border-top:1px solid var(--g200)}
.tu{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100)}
.tu img{width:56px;height:56px;object-fit:contain}
.tu__b{flex:1;min-width:0}
.tu__n{font-size:13px;font-weight:600;line-height:1.3}
.tu__p{font-size:13px;font-weight:800}
.pp{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--g200);border-radius:8px;cursor:pointer}
.pp+.pp{margin-top:8px}
.pp.sel{border-color:#000}
.toast{position:absolute;left:12px;right:12px;top:110px;z-index:75;background:#fff;border-left:4px solid var(--ok);box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:6px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s}
.dev--d .toast{left:auto;right:40px;width:420px;top:150px}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast .ico{color:var(--ok)}
.toast a{color:var(--or-s);font-weight:600;text-decoration:underline}
.spin{position:absolute;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;z-index:5}
.spin i{width:42px;height:42px;border-radius:50%;border:4px solid var(--g200);border-top-color:var(--or);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.vchip{position:absolute;z-index:85;top:44px;left:12px;background:rgba(17,17,17,.85);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;pointer-events:none}
.dev--d .vchip{top:9px;left:auto;right:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------------- state ---------------- */
const CARTS = {1:[['wchoc',1],['chips',2],['d3',1]],2:[['wchoc',1],['chips',2],['d3',1]],3:[['wchoc',1],['chips',2],['d3',1]],4:[['wchoc',2],['chips',2],['d3',1],['colla',1]],5:[]};
function tabState(t){
  return {route:TESTS[t].start,cart:CARTS[t].map(([id,q])=>({id,q})),gift:null,giftDeclined:false,giftsOpen:false,giftGuard:false,
    coupon:null,couponOpen:false,ship:null,point:null,pay:null,agree:false,note:false,email:'jan.novak@gmail.com',billing:false,
    fromMini:false,miniBanner:true,mini:false,sheet:null,err:'',descOpen:false,flavor:'wchoc',qty:1,pdpTab:'popis',acc:'popis',
    oisOpen:false,loading:false,orderNo:String(300000000+Math.floor(Math.random()*899999)),added:{}};
}
let S = {tab:1,vp:'mobile',vars:{1:'A',2:'A',3:'A',4:'A',5:'A'}};
Object.assign(S,tabState(1));
const v = n => S.tab===n ? S.vars[n] : 'A';
const isM = () => S.vp==='mobile';

/* ---------------- helpers ---------------- */
const fmt = n => n.toFixed(2).replace('.',',')+' €';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img = id => IMG[id]||'';
const stars = r => '★★★★★'.slice(0,Math.round(r))+'☆☆☆☆☆'.slice(0,5-Math.round(r));
function totals(){
  const sub = S.cart.reduce((a,i)=>a+P[i.id].p*i.q,0);
  const disc = S.coupon ? Math.round(sub*0.10*100)/100 : 0;
  const base = sub-disc;
  const m = S.ship ? findShip(S.ship) : null;
  const shipP = m ? (base>=FREE_SHIP ? 0 : m.p) : null;
  const count = S.cart.reduce((a,i)=>a+i.q,0) + (S.gift?1:0);
  return {sub,disc,base,m,shipP,total:base+(shipP||0),count};
}
const findShip = id => SHIP.flatMap(g=>g.items).find(x=>x.id===id);
const giftAvail = () => totals().base >= GIFT_AT;
const giftPending = () => giftAvail() && !S.gift && !S.giftDeclined;
const plural = n => n===1?'položka':(n>=2&&n<=4?'položky':'položiek');

/* ---------------- components ---------------- */
function header(){
  const r=S.route, t=totals();
  if(r==='shipping'||r==='payment'||r==='success'){
    const st = r==='shipping'?2:r==='payment'?3:4;
    const s=(n,l)=>`<span class="${st>n?'done':st===n?'on':''}"><i>${st>n?'✓':n}</i>${l}</span>`;
    return `<header class="hd hd--min"><div class="wrap hd__row">
      <a class="hd__logo" data-go="${S.tab>=4?'pdp':'cart'}">${LOGO}</a>
      ${!isM()&&r!=='success'?`<div class="hstep">${s(1,'Košík')}<hr>${s(2,'Doručenie')}<hr>${s(3,'Platba')}</div><div class="hd__secure">${I.lock} Bezpečný nákup</div>`:''}
    </div></header>${isM()&&r!=='success'?mSteps(st):''}`;
  }
  const cnt = t.count;
  return `<header class="hd"><div class="wrap hd__row">
    ${isM()?`<button class="hd__burger">${I.menu}</button>`:''}
    <a class="hd__logo" data-go="pdp">${LOGO}</a>
    ${!isM()?`<div class="hd__search">${I.search}<input class="in" placeholder="Hľadajte v obchode..."></div>`:''}
    <div class="hd__ctrls">
      <a class="ic">${I.user}</a><a class="ic">${I.heart}</a>
      <div class="hd__cart" id="hdcart">
        <a class="ic" data-act="cartIcon">${I.cart}${cnt?`<span class="badge" id="badge">${cnt>999?'999+':cnt}</span>`:''}${S.tab===4&&!isM()&&S.route==='pdp'?'<span class="pulse"></span>':''}</a>
        ${!isM()&&cnt?`<span class="hd__sum" data-act="cartIcon">${fmt(t.base)}</span>`:''}
        ${!isM()?minicart():''}
      </div>
    </div>
  </div>
  ${isM()?`<div class="hd__msearch">${I.search}<input class="in" placeholder="Hľadajte v obchode..."></div>`:''}
  ${!isM()?`<nav class="hd__nav"><div class="wrap"><a>Proteíny</a><a>Výživa</a><a>Vitamíny a minerály</a><a>Zdravé potraviny</a><a>Oblečenie</a><a>Fitness doplnky</a><a class="sale">Výpredaj</a></div></nav>`:''}
  </header>${isM()&&r==='cart'?mSteps(1):''}`;
}
function mSteps(st){
  const s=(n,l)=>`<div class="step ${st>n?'done':st===n?'on':''}"><i>${st>n?'✓':n}</i>${l}</div>`;
  return `<div class="steps">${s(1,'Košík')}<hr>${s(2,'Doručenie')}<hr>${s(3,'Platba')}</div>`;
}
function minicart(){
  const B = v(4)==='B';
  const items = S.cart.map(i=>`<div class="mc__it"><img src="${img(i.id)}" alt=""><div><div class="mc__n">${esc(P[i.id].n)}</div><div class="mc__v">${esc(P[i.id].v)}</div><div class="mc__v">Množstvo: ${i.q}</div></div><div class="mc__p">${fmt(P[i.id].p*i.q)}</div></div>`).join('')
    + (S.gift?`<div class="mc__it"><img src="${img(S.gift)}" alt=""><div><div class="mc__n">${esc(P[S.gift].n)}</div><div class="ci__gift">${I.gift} Darček</div></div><div class="mc__p">0,00 €</div></div>`:'');
  if(!S.cart.length) return `<div class="mc ${S.mini?'open':''}" id="mc"><div class="mc__empty">Nemáte žiadne položky v nákupnom košíku.</div></div>`;
  return `<div class="mc ${S.mini?'open':''}" id="mc"><div class="mc__list">${items}</div><div class="mc__foot">
    ${B?`<div class="mstep"><span class="done"><i>✓</i>Košík</span><hr><span class="nx"><i>2</i>Doručenie</span><hr><span><i>3</i>Platba</span></div>
      ${giftPending()?`<div class="mc__gift">${I.gift}<span>Máte nárok na darček zadarmo – <a class="lnk" data-act="miniCart" data-gifts="1">vyberte si ho v košíku</a></span></div>`:''}
      <button class="btn btn--or btn--full" data-act="miniCta">Pokračovať k doručeniu ${I.chev}</button>
      <div class="mc__sec"><a class="lnk" data-act="miniCart">Zobraziť a upraviť košík</a></div>`
    :`<button class="btn btn--or btn--full" data-act="miniCta">Prejsť do pokladne</button>`}
  </div></div>`;
}
function goals(opts={}){
  const t=totals(); const b=t.base;
  const sr=Math.max(0,FREE_SHIP-b), gr=Math.max(0,GIFT_AT-b);
  const row=(cls,ic,label,rem,pct,ok)=>`<div class="goal goal--${cls}"><div class="goal__r">${ic}<span class="goal__l">${label}</span><span class="goal__rem ${ok?'ok':''}">${ok?'✓ splnené':'ešte '+fmt(rem)}</span></div><div class="goal__bar"><i style="width:${Math.min(100,pct)}%"></i></div></div>`;
  const giftLabel = S.gift ? 'Darček zadarmo – vybraný' : (gr===0 ? 'Darček zadarmo – vyberte si ho' : 'Darček zadarmo');
  const inner = row('ship',I.truck,sr===0?'Dopravu máte zadarmo':'Doprava zadarmo',sr,b/FREE_SHIP*100,sr===0)
    + row('gift',I.gift,giftLabel,gr,b/GIFT_AT*100,gr===0);
  if(opts.enhanced){
    const act = sr>0 ? `<div class="goals__top"><span>${t.m&&t.m.p>0?`Ušetríte <b>${fmt(t.m.p)}</b> za dopravu`:'Doplňte a doprava bude zadarmo'}</span><button class="btn btn--blk btn--sm" data-act="topup">${I.plus} Doplniť produkty</button></div>`
      : (gr>0 ? `<div class="goals__top"><span>Do darčeka zadarmo chýba <b>${fmt(gr)}</b></span><button class="btn btn--ol btn--sm" data-act="topup">Doplniť</button></div>`
      : (giftPending()?`<div class="goals__top"><span>${I.gift} Darček čaká na výber</span><a class="lnk" data-act="pickGifts">Vybrať darček</a></div>`:''));
    return `<div class="goals goals--b"><div class="goals__hd"><span>Vaše výhody</span><span style="font-weight:600;text-transform:none;letter-spacing:0">${fmt(b)} v košíku</span></div>${inner}${act}</div>`;
  }
  return `<div class="goals">${inner}</div>`;
}
function trust(step){
  const SETS = {
    cart:[[I.ret,'Vrátenie tovaru zadarmo','bez starostí'],[I.users,'6M+ spokojných','zákazníkov'],[I.gift,'Body za každý nákup','vernostný program']],
    shipping:[[I.bolt,'Doručenie do 24 h','rýchle dodanie'],[I.pin,'Výdajné miesta','a boxy v okolí'],[I.truck,'Sledovanie zásielky','v e-maile aj v účte']],
    payment:[[I.shield,'Bezpečná platba','šifrované spojenie'],[I.lock,'Pohodlná platba','karta, Apple Pay, dobierka'],[I.check,'Potvrdenie objednávky','hneď e-mailom']],
  };
  return `<ul class="trust">${SETS[step].map(([ic,a,b])=>`<li><span class="tico">${ic}</span>${a}${b?`<span>${b}</span>`:''}</li>`).join('')}</ul>`;
}
function tile(id,ctx){
  const p=P[id]; const done=S.added[ctx+id];
  const pct = p.o?Math.round((1-p.p/p.o)*100):0;
  return `<div class="tile"><div class="tile__img"><img src="${img(id)}" alt="" loading="lazy">${pct?`<span class="tile__lbl">-${pct} %</span>`:''}
    <button class="tile__add ${done?'done':''}" data-act="add" data-id="${id}" data-ctx="${ctx}" title="Pridať do košíka">${done?I.check:I.cart}</button></div>
    <div class="tile__n">${esc(p.n)} ${esc(p.v.split(' · ')[1]||p.v)}</div>
    <div class="tile__r"><span class="stars">${stars(p.r)}</span>(${p.rc})</div>
    <div class="tile__p">${fmt(p.p)}</div><div class="tile__u">${p.u}</div></div>`;
}
function rail(title,ids,ctx,count){
  const rid='r'+ctx;
  return `<div class="reco"><div class="reco__h"><div><p class="reco__t">${title}</p>${count?`<span class="reco__cnt">${ids.length} produktov</span>`:''}</div>
    ${!isM()?`<div class="reco__nav"><button data-act="railL" data-rail="${rid}">${I.chevL}</button><button data-act="railR" data-rail="${rid}">${I.chev}</button></div>`:''}</div>
    <div class="rail" id="${rid}">${ids.map(id=>tile(id,ctx)).join('')}</div></div>`;
}
function summary(step,opt={}){
  const t=totals(); const T3=v(3)==='B', T2=v(2)==='B';
  const cta = step==='cart' ? ((S.giftGuard&&giftPending())?'Pokračovať bez darčeka':'Pokračovať') : step==='shipping' ? 'Pokračovať' : 'Potvrdiť objednávku';
  const showGoalsDesk = !isM() && (step==='cart' || (step==='shipping'&&T2));
  return `<div class="sum ${opt.inline?'inline':''}" id="${opt.inline?'sumInline':'sumSide'}">
    <h2 class="sum__t">Zhrnutie objednávky</h2>
    ${showGoalsDesk?goals({enhanced:step==='shipping'}):''}
    ${!isM()&&step==='cart'?coupon(true):''}
    <div class="sum__lines">
      <div class="sum__l"><span>Medzisúčet</span><span>${fmt(t.sub)}</span></div>
      ${t.disc?`<div class="sum__l sum__disc"><span>Zľava (${esc(S.coupon)})</span><span>−${fmt(t.disc)}</span></div>`:''}
      ${S.gift?`<div class="sum__l"><span>Darček: ${esc(P[S.gift].n.split(' – ')[0])}</span><span class="sum__disc">Zadarmo</span></div>`:''}
      ${t.m?`<div class="sum__l"><span>Doprava <span class="muted">· ${esc(t.m.n)}</span></span><span>${t.shipP===0?'<span class="sum__disc">Zadarmo</span>':fmt(t.shipP)}</span></div>`:''}
    </div>
    <div class="sum__tot"><span style="font-weight:700">Celkom</span><b>${fmt(t.total)}</b></div>
    <div class="sum__vat">vrátane DPH</div>
    ${S.err&&opt.errHere?`<div class="sum__err">${S.err}</div>`:''}
    <button class="btn btn--or btn--full btn--lg" id="${opt.inline?'ctaInline':'ctaSide'}" data-act="${step}Cta">${cta}</button>
    ${step==='payment'?'<div class="sum__obl">S povinnosťou platby</div>':''}
    ${T3?trust(step):''}
    ${isM()&&step!=='cart'?`<div class="sum__back"><a class="lnk" data-go="${step==='shipping'?'cart':'shipping'}">‹ Späť</a></div>`:''}
  </div>`;
}
function coupon(inline){
  return `<div class="coupon" ${inline?'style="border:0;border-top:1px solid var(--g200);border-bottom:1px solid var(--g200);border-radius:0"':''}>
    <div class="coupon__h" data-act="couponToggle" ${inline?'style="padding:12px 0"':''}><span>Použiť zľavový kód</span>${S.couponOpen?I.chevD:I.chev}</div>
    ${S.couponOpen&&!S.coupon?`<div class="coupon__b" ${inline?'style="padding:0 0 12px"':''}><input class="in" id="cpn" placeholder="Vložte zľavový kupón" value="ZLAVA10"><button class="btn btn--blk" data-act="couponApply">Použiť</button></div>`:''}
    ${S.coupon?`<div class="coupon__ok" ${inline?'style="padding:0 0 12px"':''}>✓ Pridali ste zľavový kód ${esc(S.coupon)}. <a class="lnk" data-act="couponRemove">Odstrániť</a></div>`:''}
  </div>`;
}
function loyalty(){
  return `<div class="loy"><div class="loy__ic">🪙</div><div style="flex:1"><div class="loy__t">Vernostný program</div><div class="loy__s">Získajte odmeny za svoje nákupy</div></div><button class="btn btn--ol btn--sm">Registrácia</button></div>`;
}
function giftsBlock(){
  if(!giftAvail()) return '';
  const open = S.giftsOpen || !!S.gift;
  return `<div class="gifts ${S.giftGuard&&giftPending()?'hl':''}" id="gifts">
    <div class="gifts__h" data-act="giftsToggle">${I.gift}<div style="flex:1"><div class="gifts__t">${S.gift?'Darček zadarmo je vybraný':'Vyberte si darček zadarmo'}</div><div class="gifts__s">${S.gift?esc(P[S.gift].n):S.giftDeclined?'Darček ste odmietli':'Získajte ešte 1 darček'}</div></div>${open?I.chevD:I.chev}</div>
    ${open?`<div class="gifts__opts">${GIFT_OPTS.map(id=>`<div class="gopt ${S.gift===id?'sel':''}" data-act="gift" data-id="${id}">${S.gift===id?`<span class="gopt__chk">${I.check}</span>`:''}<img src="${img(id)}" alt=""><div class="gopt__n">${esc(P[id].n)}<br><span class="muted">${esc(P[id].v)}</span></div><div class="gopt__f">Zadarmo</div></div>`).join('')}</div>
      ${!S.gift&&!S.giftDeclined?`<div class="gifts__ft"><a class="lnk" data-act="giftDecline" style="color:var(--g500)">Nechcem darček</a></div>`:''}`:''}
  </div>`;
}
function cartItem(i,idx){
  const p=P[i.id];
  const dl=`<div class="ci__dl">${I.truck}Doručenie (${i.q} ks): zajtra 25. 11.</div>`;
  const qty=`<div class="qty"><button data-act="qm" data-i="${idx}">${I.minus}</button><span>${i.q}</span><button data-act="qp" data-i="${idx}">${I.plus}</button></div>`;

      <div class="ci__row">${qty}<div><div class="ci__p">${p.o?`<span class="ci__old">${fmt(p.o*i.q)}</span>`:''}${fmt(p.p*i.q)}</div></div></div>

  return `<div class="ci"><img class="ci__img" src="${img(i.id)}" alt=""><div class="ci__b"><div class="ci__n">${esc(p.n)}</div><div class="ci__v">${esc(p.v)}</div>${dl}</div>
    ${qty}<div style="text-align:right"><div class="ci__p">${fmt(p.p*i.q)}</div><div class="ci__unit">${fmt(p.p)} / ks</div></div><button class="xbtn" data-act="rm" data-i="${idx}" title="Odstrániť">${I.x}</button></div>`;

function giftItem(){
  if(!S.gift) return '';
  const p=P[S.gift];
  return `<div class="ci"><img class="ci__img" src="${img(S.gift)}" alt=""><div class="ci__b"><div class="ci__n">${esc(p.n)}</div><div class="ci__v">${esc(p.v)}</div><span class="ci__gift">${I.gift} Darček</span></div>${isM()?`<div class="ci__p" style="align-self:center">Zadarmo</div>`:`<span></span><div class="ci__p" style="text-align:right;color:var(--ok)">Zadarmo</div><button class="xbtn" data-act="giftRemove">${I.x}</button>`}</div>`;

/* ---------------- views ---------------- */
function cartView(){
  const t=totals();
  if(!S.cart.length) return `<main class="wrap cart"><div style="padding:40px 0;text-align:center"><h1 class="h1">Nákupný košík</h1><p>Nemáte žiadne položky v nákupnom košíku.</p><p>Kliknite <a class="lnk" data-go="pdp">sem</a> pre pokračovanie v nakupovaní.</p></div></main>`;
  const V1 = v(1);
  const items = S.cart.map(cartItem).join('')+giftItem();
  const head = `<div class="cart__ttl"><h1 class="h1">Nákupný košík</h1><span class="cart__cnt">${t.count} ${plural(t.count)}</span></div>`;
  const reco = rail('Zákazníci si tiež dokúpili',RECO_CART,'cart',true);
  if(isM()){
    const blocks = `<div class="m-blocks">${loyalty()}${coupon(false)}</div>`;
    const sumIn = summary('cart',{inline:true,errHere:true});
    const order = V1==='C' ? blocks+sumIn+reco : blocks+reco+sumIn;
    const sticky = V1==='B' ? `<div class="stk-b"><div class="sbar" id="sbar"><div><div class="sbar__t">Celkom <b>${fmt(t.total)}</b></div><div class="sbar__s">vrátane DPH · ${t.count} ${plural(t.count)}</div></div><button class="btn btn--or" data-act="cartCta">${(S.giftGuard&&giftPending())?'Bez darčeka':'Pokračovať'}</button></div></div>` : '';

function overlay(){
  const ov=document.getElementById('ov');
  if(S.loading){ov.className='ov on';ov.innerHTML='<div class="spin"><i></i></div>';return;}
  if(!S.sheet){ov.className='ov';ov.innerHTML='';return;}
  ov.className='ov on';
  let h='',b='',f='';
  if(S.sheet==='pick'){
    h='Vyberte výdajné miesto';
    b=`<div class="hint" style="margin-bottom:10px">${I.pin}<span>V reálnom checkoute je tu externý BoxPi widget s mapou.</span></div>`+POINTS.map((p,i)=>`<div class="pp ${S.point===i+1?'sel':''}" data-act="pickSel" data-i="${i+1}"><span class="radio"></span><div style="flex:1"><div style="font-weight:600;font-size:14px">${p}</div><div class="muted" style="font-size:12px">Po–Ne 8:00–21:00 · doručenie zajtra</div></div></div>`).join('');
  } else if(S.sheet==='topup'){
    const t=totals(); const sr=Math.max(0,FREE_SHIP-t.base), gr=Math.max(0,GIFT_AT-t.base);
    const target = sr>0?sr:gr;
    const list=['chips','moxy','shake','spread','d3','vitc','ginger','pb','vital','colla'].sort((a,c)=>Math.abs(P[a].p-target)-Math.abs(P[c].p-target)).slice(0,6);
    h=sr>0?'Doplňte do dopravy zadarmo':'Doplňte do darčeka zadarmo';
    b=`<div style="margin-bottom:10px">${goals()}</div>`+list.map(id=>`<div class="tu"><img src="${img(id)}" alt=""><div class="tu__b"><div class="tu__n">${esc(P[id].n)}</div><div class="muted" style="font-size:12px">${esc(P[id].v)}</div><div class="tu__p">${fmt(P[id].p)}</div></div><button class="btn btn--blk btn--sm" data-act="add" data-id="${id}" data-ctx="tu">${I.plus} Pridať</button></div>`).join('');
    f=`<button class="btn btn--or btn--full" data-act="sheetX">Hotovo – späť na doručenie</button>`;
  }
  ov.innerHTML=`<div class="ov__bg" data-act="sheetX"></div><div class="sheet"><div class="sheet__grab"></div><div class="sheet__h"><b>${h}</b><button class="xbtn" data-act="sheetX">${I.x}</button></div><div class="sheet__b">${b}</div>${f?`<div class="sheet__f">${f}</div>`:''}</div>`;

/* ---------------- render ---------------- */
let lastKey='';
function render(){
  chrome();
  const scr=document.getElementById('scr');
  const key=S.tab+S.route+S.vp;
  const keep = key===lastKey ? scr.scrollTop : 0;
  scr.className='scr '+(isM()?'is-m':'is-d');
  const view={cart:cartView,shipping:shippingView,payment:paymentView,success:successView,pdp:pdpView}[S.route]();
  const rs={}; if(key===lastKey) scr.querySelectorAll('.rail').forEach(r=>rs[r.id]=r.scrollLeft);
  scr.innerHTML=header()+view+footer();
  Object.entries(rs).forEach(([id,x])=>{const r=document.getElementById(id); if(r) r.scrollLeft=x;});
  scr.scrollTop=keep; lastKey=key;
  overlay(); bindHover(); onScroll(); measure();
  const h=`#t=${S.tab}&v=${S.vars[S.tab]}&vp=${S.vp==='mobile'?'m':'d'}&r=${S.route}`;
  if(location.hash!==h) history.replaceState(null,'',h);
}
let mT;
function bindHover(){
  const hc=document.getElementById('hdcart'); if(!hc||isM()) return;
  hc.onmouseenter=()=>{clearTimeout(mT);S.mini=true;document.getElementById('mc')?.classList.add('open');};
  hc.onmouseleave=()=>{mT=setTimeout(()=>{S.mini=false;document.getElementById('mc')?.classList.remove('open');},280);};
}
function onScroll(){
  const scr=document.getElementById('scr'); const sr=scr.getBoundingClientRect();
  const sb=document.getElementById('sbar');
  if(sb){const ci=document.getElementById('ctaInline'); if(ci){const r=ci.getBoundingClientRect(); sb.classList.toggle('hide', r.top < sr.bottom-40 && r.bottom>sr.top);}}
  const atc=document.getElementById('atc');
  if(atc){const r=atc.getBoundingClientRect(); const past=r.bottom < sr.top+(isM()?110:0);
    document.getElementById('dstk')?.classList.toggle('show',past); document.getElementById('mstk')?.classList.toggle('show',past);}
}
function measure(){
  const box=document.getElementById('measure'); if(!box) return;
  const scr=document.getElementById('scr');
  const offTop=el=>el.getBoundingClientRect().top-scr.getBoundingClientRect().top+scr.scrollTop;
  if(S.tab===1&&S.route==='cart'&&isM()){
    const ci=document.getElementById('ctaInline'); if(!ci) return;
    const px=Math.round(offTop(ci)), scrH=scr.clientHeight; const screens=(px/scrH).toFixed(1).replace('.',',');
    box.style.display='block';
    box.innerHTML = v(1)==='B' ? `📏 CTA dostupné hneď (sticky lišta). Inline súhrn je ${px.toLocaleString('sk')} px od vrchu (≈ ${screens} obrazovky).`
      : `📏 Inline CTA „Pokračovať“ je ${px.toLocaleString('sk')} px od vrchu stránky ≈ <b>${screens} obrazovky</b> scrollovania.`;
  } else if(S.tab===5&&S.route==='pdp'){
    const r=document.getElementById('rpdp'); if(!r) return; const px=Math.round(offTop(r));
    box.style.display='block'; box.innerHTML=`📏 Rail „Zákazníci si tiež dokúpili“ začína ${px.toLocaleString('sk')} px od vrchu ≈ <b>${(px/scr.clientHeight).toFixed(1).replace('.',',')} obrazovky</b>.`;
  } else box.style.display='none';
}

/* ---------------- actions ---------------- */
function go(r){
  S.err=''; S.mini=false; S.sheet=null;
  if(r!=='shipping'&&r!=='payment') { if(r==='cart') S.fromMini=false; }
  S.route=r; render();
}
function addToCart(id,q=1,ctx){
  const ex=S.cart.find(i=>i.id===id); if(ex) ex.q+=q; else S.cart.push({id,q});
  if(ctx) S.added[ctx+id]=true;
  const before=S._lastBase??0;
  render();
  const b=document.getElementById('badge'); b?.classList.add('bump');
  if(ctx!=='tu') toast(`Pridali ste <b>${esc(P[id].n)}</b> do svojho <a data-go="cart">nákupného košíka</a>.`);
  else { const t=totals(); if(t.base>=FREE_SHIP && t.base-P[id].p*q<FREE_SHIP) toast('Super! <b>Dopravu máte zadarmo.</b>'); else if(t.base>=GIFT_AT && t.base-P[id].p*q<GIFT_AT) toast('Odomkli ste <b>darček zadarmo</b> – vyberte si ho v košíku.'); }
}
const ACT = {
  reset(){ Object.assign(S,tabState(S.tab)); lastKey=''; render(); },
  cartIcon(){ if(isM()) return go('cart'); S.mini=!S.mini; document.getElementById('mc')?.classList.toggle('open',S.mini); },
  miniCta(){ S.mini=false; if(v(4)==='B'){ S.fromMini=true; S.miniBanner=true; S.oisOpen=true; S.route='shipping'; S.err=''; render(); } else go('cart'); },
  miniCart(el){ S.mini=false; if(el.dataset.gifts) S.giftsOpen=true; go('cart'); },
  qp(el){ S.cart[+el.dataset.i].q++; fixGift(); render(); },
  qm(el){ const it=S.cart[+el.dataset.i]; if(it.q>1) it.q--; else S.cart.splice(+el.dataset.i,1); fixGift(); render(); },
  rm(el){ S.cart.splice(+el.dataset.i,1); fixGift(); render(); },
  add(el){ addToCart(el.dataset.id,1,el.dataset.ctx); },
  giftsToggle(){ S.giftsOpen=!S.giftsOpen; render(); },
  gift(el){ S.gift=el.dataset.id; S.giftDeclined=false; render(); },
  giftDecline(){ S.giftDeclined=true; S.giftsOpen=false; render(); },
  giftRemove(){ S.gift=null; render(); },
  pickGifts(){ S.giftsOpen=true; S.giftGuard=true; S.route='cart'; S.err=''; render(); setTimeout(()=>scrollToEl('gifts'),30); },
  couponToggle(){ S.couponOpen=!S.couponOpen; render(); },
  couponApply(){ const v=(document.getElementById('cpn')?.value||'').trim().toUpperCase(); if(!v) return; S.coupon=v; render(); toast('Pridali ste zľavový kód.'); },
  couponRemove(){ S.coupon=null; render(); },
  cartCta(){
    if(giftPending() && !S.giftGuard){ S.giftGuard=true; S.giftsOpen=true; render(); setTimeout(()=>scrollToEl('gifts'),30); return; }
    S.fromMini=false; S.oisOpen=false; go('shipping');
  },
  shipSel(el){ S.ship=el.dataset.id; if(!findShip(S.ship).pick) S.point=null; else if(!S.point){ S.sheet='pick'; } S.err=''; render(); },
  pickOpen(){ S.sheet='pick'; overlay(); },
  pickSel(el){ S.point=+el.dataset.i; S.sheet=null; render(); },
  sheetX(){ S.sheet=null; render(); },
  topup(){ S.sheet='topup'; overlay(); },
  shippingCta(){
    S.email=document.getElementById('email')?.value||'';
    if(!/\S+@\S+\.\S+/.test(S.email)) S.err='Zadajte platný e-mail.';
    else if(!S.ship) S.err='Vyberte si spôsob dopravy, aby ste mohli pokračovať.';
    else if(findShip(S.ship).pick&&!S.point) S.err='Pre pokračovanie prosím vyberte výdajné miesto.';
    else { S.err=''; return go('payment'); }
    render(); setTimeout(()=>scrollToEl(isM()?'ctaInline':'shipSec'),30);
  },
  paySel(el){ S.pay=el.dataset.id; S.err=''; render(); },
  noteT(){ S.note=!S.note; render(); },
  agreeT(){ S.agree=!S.agree; S.err=''; render(); },
  billing(){ S.billing=!S.billing; },
  paymentCta(){
    if(!S.pay) S.err='Prosím vyberte spôsob platby.';
    else if(!S.agree) S.err='Prosím potvrďte všetky povinné súhlasy.';
    else { S.err=''; S.loading=true; overlay(); setTimeout(()=>{S.loading=false; go('success');},900); return; }
    render(); setTimeout(()=>scrollToEl(isM()?'ctaInline':'ctaSide'),30);
  },
  restart(){ const t=S.tab; Object.assign(S,tabState(t)); S.route=TESTS[t].start; render(); },
  oisToggle(e,ev){ if(ev.target.closest('[data-go]')) return; S.oisOpen=!S.oisOpen; render(); },
  miniBannerX(){ S.miniBanner=false; render(); },
  descT(){ S.descOpen=!S.descOpen; render(); },
  flavorBtn(el){ S.flavor=el.dataset.id; render(); },
  pq(el){ S.qty=Math.max(1,S.qty+ +el.dataset.d); render(); },
  pdpAdd(){ addToCart(S.flavor,S.qty); },
  quick(){ toast('Pre rýchly nákup je potrebné prihlásenie. <span class="muted">(Instant Checkout – mimo rozsahu testu)</span>'); },
  ptab(el){ S.pdpTab=el.dataset.k; render(); },
  acc(el){ S.acc = S.acc===el.dataset.k?null:el.dataset.k; render(); },
  railL(el){ document.getElementById(el.dataset.rail).scrollBy({left:-620,behavior:'smooth'}); },
  railR(el){ document.getElementById(el.dataset.rail).scrollBy({left:620,behavior:'smooth'}); },
};
function fixGift(){ if(!giftAvail()){ S.gift=null; S.giftGuard=false; } }
function scrollToEl(id){ const el=document.getElementById(id); const scr=document.getElementById('scr'); if(!el) return;
  const top=el.getBoundingClientRect().top-scr.getBoundingClientRect().top+scr.scrollTop-(isM()?130:20); scr.scrollTo({top,behavior:'smooth'});
  if(id.startsWith('cta')){el.classList.remove('cta-hl');void el.offsetWidth;el.classList.add('cta-hl');} }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-vp],[data-var],[data-go],[data-act]'); if(!t) return;
  if(t.matches('select')) return;
  if(t.dataset.tab){ const n=+t.dataset.tab; if(n!==S.tab){ S.tab=n; Object.assign(S,tabState(n)); lastKey=''; render(); } return; }
  if(t.dataset.vp){ S.vp=t.dataset.vp; S.mini=false; render(); return; }
  if(t.dataset.var){ S.vars[S.tab]=t.dataset.var; render(); return; }
  if(t.dataset.go){ e.preventDefault(); go(t.dataset.go); return; }
  const a=t.dataset.act; if(a==='billing'||a==='noteT'||a==='agreeT'){ ACT[a](t,e); return; }
  if(ACT[a]){ e.preventDefault(); ACT[a](t,e); }
});
document.addEventListener('change',e=>{ if(e.target.matches('select[data-act="flavor"]')){ S.flavor=e.target.value; render(); } });
document.getElementById('scr').addEventListener('scroll',onScroll,{passive:true});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  const k=e.key.toUpperCase();
  if('123'.includes(k)&&k){ document.querySelectorAll('[data-tab]')[+k-1]?.click(); }
  else if('ABC'.includes(k)&&TESTS[S.tab].vars[k]){ S.vars[S.tab]=k; render(); }
  else if(k==='M'){ S.vp='mobile'; render(); } else if(k==='D'){ S.vp='desktop'; render(); }
});
window.addEventListener('resize',()=>{ chrome(); measure(); });
(function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  const t=+h.get('t'); if(TESTS[t]){ S.tab=t; Object.assign(S,tabState(t)); const vv=h.get('v'); if(vv&&TESTS[t].vars[vv]) S.vars[t]=vv; }
  if(h.get('vp')==='d') S.vp='desktop';
  const r=h.get('r'); if(r&&TESTS[S.tab].flow.includes(r)) S.route=r;
  render();
})();
</script>
</body>
</html>
